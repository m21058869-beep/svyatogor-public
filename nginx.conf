# Реверс-прокси перед Node-процессом Next.js (`npm run start` = `next start`).
# API (Route Handlers в app/api/**) и страницы отдаются одним приложением,
# поэтому проксируется весь трафик — отдельные location для /api не нужны.

server {
    listen 80;
    server_name svyatogor.example;

    # Лимит тела запроса. Админка отправляет фото по одному, но с запасом на
    # тяжёлые пакеты ставим 150m — столько же, сколько UPLOAD_MAX_MB.
    client_max_body_size 150m;
    # Медленный канал: не обрываем долгую загрузку между пакетами данных.
    client_body_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # X-Forwarded-Host обязателен: сервер сверяет с ним Origin при multipart-загрузке (CSRF).
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Запись крупного файла в S3 может занять больше минуты.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
